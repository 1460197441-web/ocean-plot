name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        default: v0.1.1
        type: string
      publish:
        description: Upload to PyPI (enable only after configuring Trusted Publishing)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag and package version differ'
          PY
      - run: python -m pip install -e '.[dev,netcdf4]' twine
      - run: pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
