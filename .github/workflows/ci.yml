name: test-and-build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,netcdf4]'
      - run: pytest
      - run: python -m build
      - run: ocean-plot --help
      - run: ocean-plot demo --output-dir examples/output
